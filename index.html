<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HRV Card – dev</title>
    <style>
      /* A rough stand-in for a Home Assistant theme */
      :root {
        --primary-text-color: #212121; --secondary-text-color: #727272;
        --card-background-color: #fff; --divider-color: rgba(0, 0, 0, .12);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c; --divider-color: rgba(225, 225, 225, .12);
        color-scheme: dark;
      }
      body { margin: 0; padding: 24px 16px; font-family: Roboto, system-ui, sans-serif; background: Canvas; }
      #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 440px)); gap: 16px; }
      button { margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <button onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'">
      Toggle dark
    </button>
    <div id="cards"></div>
    <script type="module" src="/dev/main.ts"></script>
  </body>
</html>
